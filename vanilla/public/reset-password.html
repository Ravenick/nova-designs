<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Reset password — StructNova Designs</title>
  <link rel="stylesheet" href="/css/output.css" />
</head>
<body>
  <div id="site-nav"></div>
  <main class="mx-auto max-w-md px-4 py-16">
    <h1 class="text-2xl font-extrabold tracking-tight">Set a new password</h1>
    <p class="mt-2 text-sm text-muted-foreground">Enter a new password below to update your account.</p>
    <form id="rp-form" class="mt-6 space-y-3">
      <div class="relative">
        <input id="rp-password" type="password" minlength="6" required placeholder="New password"
          class="h-12 w-full rounded-xl border border-border bg-background px-4 pr-12 text-sm" />
        <button id="rp-toggle" type="button" class="absolute right-3 top-1/2 -translate-y-1/2 text-muted-foreground">👁</button>
      </div>
      <button class="w-full rounded-xl bg-primary py-3 text-sm font-semibold text-primary-foreground shadow-card hover:bg-primary-dark">Update password</button>
    </form>
  </main>
  <div id="site-footer"></div>
  <script type="module" src="/js/partials.js"></script>
  <script type="module">
    import { supabase, toast } from "/js/supabase.js";
    document.getElementById("rp-toggle").addEventListener("click", () => {
      const i = document.getElementById("rp-password");
      i.type = i.type === "password" ? "text" : "password";
    });
    document.getElementById("rp-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const password = document.getElementById("rp-password").value;
      const { error } = await supabase.auth.updateUser({ password });
      if (error) { toast(error.message, "error"); return; }
      toast("Password updated. Signing you in…", "success");
      setTimeout(() => location.href = "/", 900);
    });
  </script>
</body>
</html>
