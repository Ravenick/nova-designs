<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign in — StructNova Designs</title>
  <meta name="description" content="Sign in or create an account to save favorites and access your plans." />
  <link rel="stylesheet" href="/css/output.css" />
  <link rel="icon" href="/assets/logo.png" />
</head>
<body>
  <div id="site-nav"></div>
  <main class="mx-auto flex max-w-6xl items-center px-4 py-16 sm:px-6 lg:px-8">
    <div class="hidden flex-1 pr-12 lg:block">
      <div class="text-xs font-bold uppercase tracking-[0.2em] text-primary">Members</div>
      <h1 class="mt-3 text-4xl font-extrabold tracking-tight">Your home library, one click away.</h1>
      <p class="mt-4 max-w-md text-muted-foreground">Sign in to save favorites, manage downloads, and access your purchased plans anytime — from any device.</p>
    </div>
    <div class="mx-auto w-full max-w-md rounded-3xl border border-border bg-card p-8 shadow-card">
      <h2 id="a-title" class="text-2xl font-extrabold tracking-tight">Welcome back</h2>
      <p id="a-sub" class="mt-1 text-sm text-muted-foreground">Sign in to continue.</p>

      <button id="btn-google" type="button"
        class="mt-6 flex w-full items-center justify-center gap-3 rounded-xl border border-border bg-background py-3 text-sm font-semibold hover:bg-secondary disabled:opacity-60">
        <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3c-1.6 4.6-6 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3 0 5.8 1.1 7.9 3l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3 0 5.8 1.1 7.9 3l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.3l-6.2-5.1C29.2 35.5 26.7 36 24 36c-5.3 0-9.7-3.4-11.3-8L6.1 33C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.1-4 5.5l6.2 5.1c-.4.4 6.5-4.7 6.5-14.6 0-1.3-.1-2.4-.4-3.5z"/></svg>
        Continue with Google
      </button>
      <div class="my-5 flex items-center gap-3 text-xs uppercase tracking-widest text-muted-foreground">
        <div class="h-px flex-1 bg-border"></div> or <div class="h-px flex-1 bg-border"></div>
      </div>

      <form id="auth-form" class="space-y-3">
        <input id="f-name" type="text" placeholder="Full name" class="hidden h-12 w-full rounded-xl border border-border bg-background px-4 text-sm" />
        <input id="f-email" type="email" placeholder="Email address" required class="h-12 w-full rounded-xl border border-border bg-background px-4 text-sm" />
        <div id="pw-wrap" class="relative">
          <input id="f-password" type="password" placeholder="Password" minlength="6" required class="h-12 w-full rounded-xl border border-border bg-background px-4 pr-12 text-sm" />
          <button id="pw-toggle" type="button" class="absolute right-3 top-1/2 -translate-y-1/2 text-muted-foreground hover:text-primary" aria-label="Show password">👁</button>
        </div>
        <button id="btn-submit" class="mt-2 w-full rounded-xl bg-primary py-3 text-sm font-semibold text-primary-foreground shadow-card hover:bg-primary-dark disabled:opacity-60">Sign in →</button>
      </form>

      <div class="mt-6 flex items-center justify-between text-xs">
        <button id="mode-forgot" class="font-semibold text-primary hover:underline">Forgot password?</button>
        <button id="mode-signup" class="text-muted-foreground">New here? <span class="font-semibold text-primary">Sign up</span></button>
      </div>
    </div>
  </main>
  <div id="site-footer"></div>

  <script type="module" src="/js/partials.js"></script>
  <script type="module" src="/js/auth.js"></script>
</body>
</html>
